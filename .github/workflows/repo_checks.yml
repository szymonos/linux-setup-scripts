name: Preflight Checks

on:
  pull_request:

jobs:
  preflight_checks:
    name: "pre-commit hooks"
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Ensure Pester 6+ available
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge '6.0' })) {
            Install-Module Pester -MinimumVersion 6.0 -Repository PSGallery -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run pre-commit hooks
        uses: j178/prek-action@v2
        with:
          extra-args: --from-ref "origin/${{ github.event.pull_request.base.ref }}" --to-ref HEAD
